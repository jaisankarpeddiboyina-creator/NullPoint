<!DOCTYPE html>
<html>
<head>
<script>
let myLet = 1;
const myConst = 2;
var myVar = 3;
function myFunction() { return 4; }
</script>
<script type="module">
try {
  console.log("myLet:", myLet);
  console.log("myConst:", myConst);
  console.log("myVar:", myVar);
  console.log("myFunction:", myFunction());
} catch(e) {
  console.error("Module error:", e.message);
}
</script>
</head>
<body></body>
</html>
