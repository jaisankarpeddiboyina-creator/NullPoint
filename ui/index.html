<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NullPoint — Everything else is noise.</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'
  try {
    const configRes = await fetch('/api/config')
    const firebaseConfig = await configRes.json()

    const app = initializeApp(firebaseConfig)
    const auth = getAuth(app)
    const db = getFirestore(app)
    const provider = new GoogleAuthProvider()

    let currentUser = null

    // Auth state listener
    onAuthStateChanged(auth, async (user) => {
      currentUser = user
      if (user) {
        document.getElementById('auth-btn').textContent = 'Sign Out'
        document.getElementById('user-name').textContent = user.displayName
        document.getElementById('user-avatar').src = user.photoURL
        document.getElementById('user-info').style.display = 'flex'
        await loadHistory()
      } else {
        document.getElementById('auth-btn').textContent = 'Sign in with Google'
        document.getElementById('user-info').style.display = 'none'
      }
    })

    // Login/logout
    window.handleAuth = async () => {
      if (currentUser) {
        await signOut(auth)
      } else {
        await signInWithPopup(auth, provider)
      }
    }

    // Save message to Firebase
    window.saveToHistory = async (userMsg, botResponse) => {
      if (!currentUser) return
      await addDoc(collection(db, 'users', currentUser.uid, 'chats'), {
        userMessage: userMsg,
        botResponse: botResponse,
        timestamp: serverTimestamp()
      })
      await loadHistory()
    }

    window.appendMessage = (sender, text) => {
      if (sender === 'user') {
        const msgs = document.getElementById('msgs')
        if (msgs) msgs.innerHTML = ''
        addUser(text)
      } else {
        hideEmpty()
        msgCount++
        const mid = 'msg' + msgCount
        const el = document.createElement('div')
        el.className = 'msg msg-a'
        el.innerHTML = `
          <div class="bubble bubble-a" id="bb${mid}">
            ${fmt(text)}
          </div>
          <div class="rich" id="rc${mid}"></div>
          <div class="meta" id="mm${mid}"></div>`
        const msgs = document.getElementById('msgs')
        if (msgs) msgs.appendChild(el)
        scroll()
      }
    }

    window.appendMessage = window.appendMessage

    // Load history
    window.loadHistory = async () => {
      if (!currentUser) return
      const q = query(collection(db, 'users', currentUser.uid, 'chats'), orderBy('timestamp', 'desc'), limit(20))
      const snapshot = await getDocs(q)
      const historyContainer = document.getElementById('history-list')
      historyContainer.innerHTML = ''
      snapshot.forEach(doc => {
        const data = doc.data()
        const item = document.createElement('div')
        item.className = 'history-item'
        item.textContent = data.userMessage
        item.onclick = () => {
          appendMessage('user', data.userMessage)
          appendMessage('bot', data.botResponse)
        }
        historyContainer.appendChild(item)
      })
    }

    // Check user plan and usage from Firestore
    window.checkUsage = async () => {
      if (!currentUser) return { allowed: true, plan: 'free', used: 0, limit: 20 }
      const docSnap = await getDoc(doc(db, 'users', currentUser.uid))
      const data = docSnap.exists() ? docSnap.data() : {}
      const plan = data.plan || 'free'
      const used = data.queriesUsed || 0
      const limit = plan === 'free' ? 20 : plan === 'basic' ? 500 : 2000

      // Reset monthly count if month changed
      if (data.planResets && new Date() > new Date(data.planResets)) {
        await setDoc(doc(db, 'users', currentUser.uid), { queriesUsed: 0, planResets: new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1).toISOString() }, { merge: true })
        return { allowed: true, plan, used: 0, limit }
      }
      return { allowed: used < limit, plan, used, limit }
    }

    // Increment usage count
    window.incrementUsage = async () => {
      if (!currentUser) return
      const ref = doc(db, 'users', currentUser.uid)
      const snap = await getDoc(ref)
      const used = snap.exists() ? (snap.data().queriesUsed || 0) : 0
      await setDoc(ref, { queriesUsed: used + 1 }, { merge: true })
    }

    // Show paywall
    window.showPaywall = (used, limit, plan) => {
      const overlay = document.createElement('div')
      overlay.id = 'paywall'
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999;'
      overlay.innerHTML = `
        <div style="background:#111;border:1px solid #222;border-radius:16px;padding:40px;max-width:420px;text-align:center;">
          <div style="font-size:32px;margin-bottom:12px;">🔒</div>
          <h2 style="color:#fff;margin-bottom:8px;">You've used ${used}/${limit} queries</h2>
          <p style="color:#888;margin-bottom:28px;font-size:14px;">Upgrade to keep using NullPoint — still way cheaper than ChatGPT Plus.</p>
          <div style="display:flex;flex-direction:column;gap:12px;">
            <button onclick="startPayment('basic')" style="background:#00d4ff;color:#000;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;">Basic — ₹99/month · 500 queries</button>
            <button onclick="startPayment('pro')" style="background:#fff;color:#000;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;">Pro — ₹199/month · 2,000 queries</button>
            <button onclick="document.getElementById('paywall').remove()" style="background:transparent;color:#555;border:none;padding:8px;cursor:pointer;font-size:13px;">Maybe later</button>
          </div>
        </div>`
      document.body.appendChild(overlay)
    }

    // Start Razorpay payment
    window.startPayment = async (plan) => {
      if (!currentUser) return
      const orderRes = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan })
      })
      const order = await orderRes.json()
      const options = {
        key: await fetch('/api/config').then(r => r.json()).then(c => c.razorpayKeyId),
        amount: order.amount,
        currency: 'INR',
        name: 'NullPoint',
        description: plan === 'basic' ? 'Basic Plan — 500 queries/month' : 'Pro Plan — 2,000 queries/month',
        order_id: order.id,
        handler: async (response) => {
          const verify = await fetch('/api/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...response, uid: currentUser.uid, plan })
          })
          const result = await verify.json()
          if (result.success) {
            document.getElementById('paywall')?.remove()
            alert(`✅ You're now on the ${plan} plan!`)
          }
        },
        prefill: { email: currentUser.email, name: currentUser.displayName },
        theme: { color: '#00d4ff' }
      }
      const rzp = new window.Razorpay(options)
      rzp.open()
    }
  } catch(e) {
    console.warn('Firebase unavailable:', e.message)
    window.handleAuth = () => alert('Auth unavailable. Check server.')
    window.saveToHistory = async () => {}
    window.loadHistory = async () => {}
    window.checkUsage = async () => ({ allowed: true, plan: 'free', used: 0, limit: 20 })
    window.incrementUsage = async () => {}
    window.showPaywall = () => alert('Please sign in to continue using NullPoint.')
  }
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--s1:#111;--s2:#161616;--s3:#1e1e1e;
  --b1:#222;--b2:#2a2a2a;--b3:#333;
  --t1:#eaeaea;--t2:#888;--t3:#444;
  --ac:#00d4ff;--ac2:#0099bb;
  --green:#00ff88;--red:#ff4466;--yellow:#ffcc00;
  --r:12px;--rs:8px;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;max-width:820px;margin:0 auto}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;border-bottom:1px solid var(--b1);flex-shrink:0}
.logo{display:flex;align-items:baseline;gap:0}
.logo-n{font-size:19px;font-weight:900;letter-spacing:-1px;color:var(--t1)}
.logo-p{font-size:19px;font-weight:900;letter-spacing:-1px;color:var(--ac)}
.logo-tag{font-size:11px;color:var(--t3);margin-left:10px;letter-spacing:.3px}
.hdr-r{display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-new{background:transparent;border:1px solid var(--b2);color:var(--t2);padding:5px 12px;border-radius:var(--rs);font-size:12px;cursor:pointer;transition:all .15s}
.btn-new:hover{border-color:var(--ac);color:var(--ac)}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:28px;padding:40px 20px}
.empty-logo{font-size:44px;font-weight:900;letter-spacing:-3px}
.empty-logo span:first-child{color:var(--t1)}
.empty-logo span:last-child{color:var(--ac)}
.empty-sub{color:var(--t2);font-size:13px;max-width:300px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:560px}
.chip{background:var(--s1);border:1px solid var(--b1);color:var(--t2);padding:7px 13px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ac);color:var(--ac);background:rgba(0,212,255,.05)}

/* Messages */
.msg{display:flex;flex-direction:column;gap:8px}
.msg-u{align-items:flex-end}
.msg-a{align-items:flex-start}
.bubble{padding:11px 15px;border-radius:var(--r);font-size:14px;line-height:1.7;max-width:78%}
.bubble-u{background:var(--ac);color:#000;font-weight:500;border-bottom-right-radius:3px}
.bubble-a{background:var(--s1);border:1px solid var(--b1);border-bottom-left-radius:3px;color:var(--t1);max-width:100%}
.bubble-a strong{color:var(--ac);font-weight:600}
.bubble-a code{background:var(--s2);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:13px;color:var(--green)}
.meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:6px;padding:0 2px;flex-wrap:wrap}
.badge{background:var(--s1);border:1px solid var(--b1);padding:2px 7px;border-radius:10px;font-size:10px}

/* Rich */
.rich{display:flex;flex-direction:column;gap:10px;width:100%}

/* Image */
.r-img{border-radius:var(--r);overflow:hidden;border:1px solid var(--b1);background:var(--s1)}
.r-img img{width:100%;max-height:380px;object-fit:cover;display:block}
.r-img-cap{padding:9px 13px;font-size:12px;color:var(--t2);border-top:1px solid var(--b1)}

/* Gallery */
.r-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.g-item{border-radius:var(--rs);overflow:hidden;border:1px solid var(--b1);background:var(--s1);cursor:pointer;transition:border-color .15s}
.g-item:hover{border-color:var(--ac)}
.g-item img{width:100%;height:130px;object-fit:cover;display:block}
.g-item-lbl{padding:7px 9px;font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Card */
.r-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px}
.card-ttl{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.ci{background:var(--s2);border-radius:var(--rs);padding:10px 12px}
.ci-lbl{font-size:11px;color:var(--t3);margin-bottom:3px}
.ci-val{font-size:15px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}

/* List */
.r-list{display:flex;flex-direction:column;gap:7px}
.li{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:11px 13px;transition:border-color .15s}
.li:hover{border-color:var(--b2)}
.li a{color:var(--t1);text-decoration:none;font-size:13px;font-weight:500;display:block;margin-bottom:3px}
.li a:hover{color:var(--ac)}
.li-meta{font-size:11px;color:var(--t3);display:flex;gap:8px}
.li-sub{font-size:12px;color:var(--t2);margin-bottom:3px}

/* Chart */
.r-chart{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px}
.chart-ttl{font-size:12px;color:var(--t2);margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bar{width:100%;background:var(--ac);border-radius:3px 3px 0 0;opacity:.65;min-height:3px;transition:opacity .15s}
.bar:hover{opacity:1}
.bar-lbl{font-size:10px;color:var(--t3)}

/* Thinking */
.thinking{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px}
.dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ac);animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* Cursor */
.cursor{display:inline-block;width:2px;height:14px;background:var(--ac);margin-left:2px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Input */
.inp-area{padding:14px 24px 22px;flex-shrink:0}
.inp-wrap{display:flex;align-items:flex-end;gap:9px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:11px 13px;transition:border-color .15s}
.inp-wrap:focus-within{border-color:var(--ac);box-shadow:0 0 0 1px rgba(0,212,255,.08)}
textarea{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-family:inherit;font-size:14px;line-height:1.6;resize:none;min-height:24px;max-height:150px;overflow-y:auto}
textarea::placeholder{color:var(--t3)}
.btn-send{width:33px;height:33px;background:var(--ac);border:none;border-radius:var(--rs);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.btn-send:hover{background:var(--ac2);transform:scale(1.05)}
.btn-send:disabled{background:var(--b1);cursor:not-allowed;transform:none}
.btn-send svg{width:15px;height:15px;fill:#000}
.inp-hint{font-size:11px;color:var(--t3);text-align:center;margin-top:8px}
.inp-hint kbd{background:var(--s1);border:1px solid var(--b2);border-radius:3px;padding:1px 5px;font-family:monospace;font-size:10px}
.history-item {
  padding: 10px 12px;
  margin-bottom: 8px;
  background: var(--s2);
  border: 1px solid var(--b1);
  border-radius: var(--rs);
  color: var(--t2);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}
.history-item:hover {
  background: var(--s3);
  border-color: var(--ac);
  color: var(--t1);
}
@media print {
  body { background: #fff !important; color: #000 !important; }
  #history-sidebar, .inp-area, .hdr, button, .btn-new, #auth-btn, #user-info, .dot { display: none !important; }
  .app { max-width: 100% !important; height: auto !important; }
  .msgs { overflow: visible !important; height: auto !important; padding: 20px !important; }
  .bubble-u { background: #e3f2fd !important; color: #000 !important; }
  .bubble-a { background: #f5f5f5 !important; color: #000 !important; border: 1px solid #ddd !important; }
  .r-card, .r-list, .r-chart { border: 1px solid #ddd !important; background: #fafafa !important; }
  .ci { background: #f0f0f0 !important; }
  .ci-val, .ci-lbl { color: #000 !important; }
  .r-img img { max-height: 300px !important; }
  .meta { color: #666 !important; }
  .badge { border: 1px solid #ccc !important; color: #333 !important; }
  a { color: #000 !important; }
}
button:focus-visible, textarea:focus-visible, a:focus-visible, .chip:focus-visible, .g-item:focus-visible, .history-item:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="history-sidebar" style="position:fixed; left:0; top:0; width:240px; height:100vh; background:#111; border-right:1px solid #222; padding:16px; overflow-y:auto; transform:translateX(-240px); transition:transform 0.3s; z-index:100;">
  <h3 style="color:#00e5ff; margin:0 0 16px;">History</h3>
  <div id="history-list"></div>
</div>
<button aria-label="Toggle chat history" aria-expanded="false" onclick="const sb = document.getElementById('history-sidebar'); const open = sb.style.transform === 'translateX(0px)'; sb.style.transform = open ? 'translateX(-240px)' : 'translateX(0px)'; this.style.transform = open ? 'translateX(0px)' : 'translateX(240px)'; this.setAttribute('aria-expanded', String(!open))" style="position:fixed; left:12px; top:50%; background:#222; border:1px solid #333; color:#fff; padding:8px; border-radius:8px; cursor:pointer; z-index:101; transition:transform 0.3s;">☰</button>

<div class="app">

  <header class="hdr">
    <div class="logo">
      <span class="logo-n">NULL</span><span class="logo-p">POINT</span>
      <span class="logo-tag">Everything else is noise.</span>
    </div>
    <div class="hdr-r">
      <div class="dot"></div>
      <div id="user-info" style="display:none; align-items:center; gap:8px;">
        <img id="user-avatar" style="width:28px; height:28px; border-radius:50%;" />
        <span id="user-name" style="color:#fff; font-size:13px;"></span>
      </div>
      <button id="auth-btn" onclick="handleAuth()" style="background:#00e5ff; color:#000; border:none; padding:6px 14px; border-radius:20px; cursor:pointer; font-weight:600;">Sign in with Google</button>
      <button class="btn-new" onclick="newChat()">New Chat</button>
      <button class="btn-new" onclick="window.print()">Export PDF</button>
    </div>
  </header>

  <main class="msgs" id="msgs">
    <div class="empty" id="empty">
      <div class="empty-logo"><span>NULL</span><span>POINT</span></div>
      <p class="empty-sub">Real-time data from the entire world. One question away.</p>
      <div class="chips" id="chips">
        <button class="chip" onclick="go(this)">🌤 Weather in Tokyo</button>
        <button class="chip" onclick="go(this)">₿ Bitcoin price now</button>
        <button class="chip" onclick="go(this)">🚀 Latest space news</button>
        <button class="chip" onclick="go(this)">🎌 Anime: Attack on Titan</button>
        <button class="chip" onclick="go(this)">📚 Books by Dostoevsky</button>
        <button class="chip" onclick="go(this)">🎨 Monet paintings</button>
        <button class="chip" onclick="go(this)">🔐 CVE vulnerabilities</button>
        <button class="chip" onclick="go(this)">🧬 AI research papers</button>
        <button class="chip" onclick="go(this)">🏎 F1 standings 2024</button>
        <button class="chip" onclick="go(this)">🌍 GDP of Japan</button>
        <button class="chip" onclick="go(this)">🖼 Generate image: neon city rain</button>
        <button class="chip" onclick="go(this)">😄 Tell me a joke</button>
      </div>
    </div>
  </main>

  <div class="inp-area">
    <div class="inp-wrap">
      <textarea id="inp" placeholder="Ask anything..." rows="1"
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="inp-hint"><kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line</p>
  </div>

</div>
<script>
const BASE = `${window.location.origin}/api`
const KEY  = localStorage.getItem('np_key') || ''

let busy = false
let chatMessageCount = 0
const MAX_MESSAGES_PER_CHAT = { free: 10, basic: 20, pro: 50 }

const $  = id => document.getElementById(id)
const esc = t => String(t || '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#x27;')
  .replace(/\//g,'&#x2F;')

const sanitizeUrl = u => {
  if (!u) return ''
  const trimmed = String(u).trim()
  if (trimmed.toLowerCase().startsWith('javascript:') || trimmed.toLowerCase().startsWith('data:')) {
    return '#'
  }
  return esc(trimmed)
}

const fmt = t => {
  if (!t) return ''
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>')
}

let msgCount=0
function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function go(btn){$('inp').value=btn.textContent.replace(/^[^\w₿🌤🚀🎌📚🎨🔐🧬🏎🌍🖼😄]+/,'').trim();resize($('inp'));send()}
function scroll(){const m=$('msgs');m.scrollTop=m.scrollHeight}
function hideEmpty(){const e=$('empty');if(e)e.remove()}

// ── Render rich content ─────────────────────────────────────────
function renderRich(content){
  return content.map(rc=>{
    switch(rc.type){
      case 'image':   return rImage(rc.data)
      case 'gallery': return rGallery(rc.data, rc.toolName)
      case 'card':    return rCard(rc.toolName, rc.data)
      case 'list':    return rList(rc.data)
      case 'chart':   return rChart(rc.data)
      default:        return ''
    }
  }).join('')
}

function rImage(d){
  if(!d) return ''
  const url = d.url || d.message || d.hdurl
  if(!url) return ''
  const sanitized = sanitizeUrl(url)
  const cap = d.caption || d.title || d.prompt || ''
  const desc = d.explanation ? `<div class="r-img-cap">${esc(d.explanation.slice(0,200))}...</div>` : ''
  return `<div class="r-img">
    <img src="${sanitized}" alt="${esc(cap)}" loading="lazy" onerror="this.parentElement.style.display='none'">
    ${cap?`<div class="r-img-cap">${esc(cap)}</div>`:''}${desc}
  </div>`
}

function rGallery(data, toolName){
  if(!Array.isArray(data)) return rImage(data)
  const items = data.slice(0,8).map(item=>{
    let img='', lbl=''
    if(toolName==='getPokemon'){img=item.sprite;lbl=item.name}
    else if(toolName==='getWikipediaSummary'){img=item.thumbnail;lbl=item.title}
    else{ img=item.image||item.cover||item.strMealThumb||item.thumbnail;lbl=item.name||item.title||item.strMeal||item.titleEnglish||'' }
    if(!img) return ''
    const imgUrl = sanitizeUrl(img)
    return `<div class="g-item">
      <img src="${imgUrl}" alt="${esc(lbl)}" loading="lazy" onerror="this.parentElement.style.display='none'">
      <div class="g-item-lbl">${esc(lbl)}</div>
    </div>`
  }).join('')
  if(!items.trim()) return ''
  return `<div class="r-gallery">${items}</div>`
}

function rCard(tool, d){
  if(!d) return ''
  if(tool==='getWeather'){
    const c=d.current||{}
    const wc=c.weather_code
    const icon=wc==0?'☀️':wc<=3?'⛅':wc<=48?'🌫️':wc<=67?'🌧️':wc<=77?'❄️':wc<=82?'🌦️':'⛈️'
    return `<div class="r-card">
      <div class="card-ttl">${icon} ${esc(d.location||'Weather')}</div>
      <div class="card-grid">
        <div class="ci"><div class="ci-lbl">Temperature</div><div class="ci-val">${esc(String(c.temperature_2m??'--'))}°C</div></div>
        <div class="ci"><div class="ci-lbl">Feels Like</div><div class="ci-val">${esc(String(c.apparent_temperature??'--'))}°C</div></div>
        <div class="ci"><div class="ci-lbl">Humidity</div><div class="ci-val">${esc(String(c.relative_humidity_2m??'--'))}%</div></div>
        <div class="ci"><div class="ci-lbl">Wind</div><div class="ci-val">${esc(String(c.wind_speed_10m??'--'))} km/h</div></div>
      </div></div>`
  }
  if(tool==='getCryptoPrice'&&Array.isArray(d)){
    const rows=d.slice(0,4).map(c=>{
      const chg=c.price_change_percentage_24h||0
      return `<div class="ci">
        <div class="ci-lbl">${esc((c.symbol||'').toUpperCase())}</div>
        <div class="ci-val">$${esc((c.current_price||0).toLocaleString(undefined,{maximumFractionDigits:2}))}</div>
        <div class="ci-lbl ${chg>=0?'pos':'neg'}" style="color:${chg>=0?'var(--green)':'var(--red)'}">${chg>=0?'▲':'▼'} ${esc(Math.abs(chg).toFixed(2))}%</div>
      </div>`}).join('')
    return `<div class="r-card"><div class="card-ttl">💹 Crypto Prices</div><div class="card-grid">${rows}</div></div>`
  }
  if(tool==='getCountryInfo'){
    const c=Array.isArray(d)?d[0]:d
    if(!c) return ''
    return `<div class="r-card">
      <div class="card-ttl">${esc(c.flag||'🌍')} ${esc(c.name?.common||'')}</div>
      <div class="card-grid">
        <div class="ci"><div class="ci-lbl">Capital</div><div class="ci-val" style="font-size:13px">${esc(c.capital?.[0]||'--')}</div></div>
        <div class="ci"><div class="ci-lbl">Population</div><div class="ci-val" style="font-size:13px">${esc((c.population||0).toLocaleString())}</div></div>
        <div class="ci"><div class="ci-lbl">Region</div><div class="ci-val" style="font-size:13px">${esc(c.region||'--')}</div></div>
        <div class="ci"><div class="ci-lbl">Currency</div><div class="ci-val" style="font-size:13px">${esc(Object.keys(c.currencies||{})[0]||'--')}</div></div>
      </div></div>`
  }
  if(tool==='getGithubUser'){
    const avatarUrl = sanitizeUrl(d.avatar)
    return `<div class="r-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        ${avatarUrl?`<img src="${avatarUrl}" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--b2)">`:''}
        <div><div style="font-weight:700">${esc(d.name||d.login)}</div><div style="font-size:12px;color:var(--t2)">@${esc(d.login)}</div></div>
      </div>
      <div class="card-grid">
        <div class="ci"><div class="ci-lbl">Followers</div><div class="ci-val">${esc((d.followers||0).toLocaleString())}</div></div>
        <div class="ci"><div class="ci-lbl">Repos</div><div class="ci-val">${esc(String(d.public_repos||0))}</div></div>
      </div></div>`
  }
  return ''
}

function rList(data){
  if(!Array.isArray(data)||!data.length) return ''
  return '<div class="r-list">'+data.slice(0,8).map(function(item){
    const title=item.title||item.name||item.question||`${item.driver||''} ${item.points?`(${item.points}pts)`:''}`
    const rawUrl=item.url||item.link||item.html_url||''
    const url=sanitizeUrl(rawUrl)
    const sub=item.summary||item.snippet||item.description||''
    const meta=[
      item.score&&`⭐ ${item.score}`,
      item.by&&`by ${item.by}`,
      item.published&&new Date(item.published).toLocaleDateString(),
      item.status,item.position&&`#${item.position}`,
      item.remote&&'🌎 Remote',item.severity&&`🔴 ${item.severity}`,
    ].filter(Boolean).slice(0,3)
    return '<div class="li">'
      +(url && url !== '#'?'<a href="'+url+'" target="_blank" rel="noopener">'+esc(title)+'</a>':'<div style="font-size:13px;font-weight:500;margin-bottom:3px">'+esc(title)+'</div>')
      +(sub?'<div class="li-sub">'+esc(sub.slice(0,120))+'...</div>':'')
      +'<div class="li-meta">'+meta.map(function(m){return '<span>'+esc(String(m))+'</span>'}).join('')+'</div>'
      +'</div>'
  }).join('')+'</div>'
}

function rChart(d){
  if(!d||!d.data||!d.data.length) return ''
  const vals=d.data.map(function(x){return x.value}).filter(function(v){return v!=null})
  const max=Math.max.apply(null,vals)||1
  return '<div class="r-chart">'
    +'<div class="chart-ttl">'+esc(d.country||'')+' — '+esc(d.indicator||'')+'</div>'
    +'<div class="bars">'+d.data.slice(-8).map(function(x){
      const pct=(x.value/max)*100
      return '<div class="bar-wrap">'
        +'<div class="bar" style="height:'+pct+'%" title="'+esc(x.value?x.value.toLocaleString():'')+'"></div>'
        +'<div class="bar-lbl">'+esc(String(x.year))+'</div>'
        +'</div>'
    }).join('')+'</div>'
    +'</div>'
}

// ── Add messages ────────────────────────────────────────────────
function addUser(text){
  hideEmpty()
  const el=document.createElement('div')
  el.className='msg msg-u'
  el.innerHTML=`<div class="bubble bubble-u">${esc(text)}</div>`
  $('msgs').appendChild(el)
  scroll()

  chatMessageCount++
  if (typeof window.checkUsage === 'function') {
    window.checkUsage().then(usage => {
      const max = MAX_MESSAGES_PER_CHAT[usage.plan] || 10
      if (chatMessageCount >= max) {
        setTimeout(() => {
          if(confirm('Long conversation detected. Start a new chat to keep responses accurate and fast?')) {
            newChat()
            chatMessageCount = 0
          }
        }, 500)
      }
    }).catch(() => {})
  }
}

function addBot(){
  msgCount++
  const mid='msg'+msgCount
  const el=document.createElement('div')
  el.className='msg msg-a'
  el.innerHTML=`
    <div class="bubble bubble-a" id="bb${mid}">
      <div class="thinking"><div class="dots"><span></span><span></span><span></span></div>Thinking...</div>
    </div>
    <div class="rich" id="rc${mid}"></div>
    <div class="meta" id="mm${mid}"></div>`
  $('msgs').appendChild(el)
  scroll()
  return {id:mid, bb:$('bb'+mid), rc:$('rc'+mid), mm:$('mm'+mid)}
}

// ── Send ────────────────────────────────────────────────────────
async function send(){
  const el=$('inp')
  const q=el.value.trim()
  if(!q||busy) return

  // Check usage limit
  const usage = await window.checkUsage()
  if (!usage.allowed) {
    window.showPaywall(usage.used, usage.limit, usage.plan)
    return
  }

  busy=true; el.value=''; el.style.height='auto'; $('sendBtn').disabled=true

  let text='', started=false, content=[]
  let bb, rc, mm

  try{
    addUser(q)
    const botMsg=addBot()
    bb=botMsg.bb; rc=botMsg.rc; mm=botMsg.mm

    const resp=await fetch(`${BASE}/stream`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-NullPoint-Key':KEY},
      body:JSON.stringify({query:q})
    })
    if(!resp.ok) throw new Error(`Server ${resp.status}. Is NullPoint running?`)

    const reader=resp.body.getReader()
    const dec=new TextDecoder()
    let buf=''

    while(true){
      const{done,value}=await reader.read()
      if(done) break
      buf+=dec.decode(value,{stream:true})
      const lines=buf.split('\n')
      buf=lines.pop()||''

      for(const line of lines){
        if(!line.startsWith('data:')) continue
        try{
          const d=JSON.parse(line.slice(5))
          if(d.token!==undefined){
            if(!started){bb.innerHTML='';started=true}
            text+=d.token
            bb.innerHTML=fmt(text)+'<span class="cursor"></span>'
            scroll()
          }
          if(d.content){
            if(!started){bb.innerHTML='';started=true}
            // Accumulate content (ensure it's an array)
            if(Array.isArray(d.content)){
              content=content.concat(d.content)
            }else if(d.content){
              content.push(d.content)
            }
            // Render accumulated content
            if(content.length>0){
              rc.innerHTML=renderRich(content)
              scroll()
            }
          }
          if(d.toolsUsed!==undefined){
            // Ensure thinking message is cleared
            if(!started){bb.innerHTML='';started=true}
            bb.innerHTML=fmt(text)
            // Final render with all accumulated content
            if(content.length>0){
              rc.innerHTML=renderRich(content)
            }
            if(d.toolsUsed.length) mm.innerHTML=d.toolsUsed.map(t=>`<span class="badge">${t}</span>`).join('')+`<span>${d.duration}ms</span>`
          }
          if(d.message) throw new Error(d.message)
        }catch(e){if(e.message&&!e.message.includes('JSON')) throw e}
      }
    }
    if (started && text) {
      window.saveToHistory(q, text).catch(e => console.warn('Failed to save to history:', e))
      await window.incrementUsage()
    }
  }catch(e){
    bb.innerHTML='<span style="color:var(--red)">⚠ '+esc(e.message)+'</span>'
  }finally{
    busy=false; $('sendBtn').disabled=false; $('inp').focus()
  }
}

async function newChat(){
  chatMessageCount = 0
  try{await fetch(`${BASE}/reset`,{method:'POST',headers:{'X-NullPoint-Key':KEY}})}catch(e){}
  $('msgs').innerHTML=`<div class="empty" id="empty">
    <div class="empty-logo"><span>NULL</span><span>POINT</span></div>
    <p class="empty-sub">Real-time data from the entire world. One question away.</p>
    <div class="chips">
      <button class="chip" onclick="go(this)">🌤 Weather in Tokyo</button>
      <button class="chip" onclick="go(this)">₿ Bitcoin price now</button>
      <button class="chip" onclick="go(this)">🚀 Latest space news</button>
      <button class="chip" onclick="go(this)">🎌 Anime: Attack on Titan</button>
      <button class="chip" onclick="go(this)">📚 Books by Dostoevsky</button>
      <button class="chip" onclick="go(this)">🎨 Monet paintings</button>
      <button class="chip" onclick="go(this)">🔐 CVE vulnerabilities</button>
      <button class="chip" onclick="go(this)">🖼 Generate image: neon city rain</button>
    </div>
  </div>`
}

window.onload=()=>{
  $('inp').focus()
  console.log('send ready, busy=', busy)
  // API key can be set via env file or localStorage
}
